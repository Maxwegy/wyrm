[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wyrm"
version = "0.2.0"
description = "One open-source, offline app for all your mice: profiles per activity, auto-switch by app, DPI, buttons, lighting and macros."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["PySide6>=6.6", "hidapi>=0.14"]

[project.optional-dependencies]
dev = ["pytest>=8", "pyinstaller>=6"]

[project.gui-scripts]
wyrm = "wyrm.app:main"

[tool.setuptools.packages.find]
include = ["wyrm*"]

[tool.setuptools.package-data]
"wyrm.drivers.sinowealth" = ["models/*.json", "models/*.bin"]

[tool.pytest.ini_options]
testpaths = ["tests"]
