name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
      - run: python packaging/make_icon.py
      - run: python -m PyInstaller --noconfirm --clean packaging/wyrm.spec
      - run: python -m PyInstaller --noconfirm --clean --distpath dist/onefile packaging/wyrm-onefile.spec
      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path dist/Wyrm/* -DestinationPath Wyrm-windows.zip
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/onefile/Wyrm.exe Wyrm-windows.zip --title "Wyrm ${{ github.ref_name }}" --generate-notes
